[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raftstore"
version = "0.1.0"
description = "Self-healing replicated blob/KV storage on a from-scratch Raft implementation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # stdlib only at runtime

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
raftstore = "raftstore.cli:main"

[tool.setuptools.packages.find]
include = ["raftstore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running randomized or multi-process tests",
  "cluster: spawns real OS processes on localhost",
]
