name: Bug report
description: Something behaves incorrectly (lost or incorrect data, a crash, a failing test)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security issues, please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, config, or a simulator seed and scenario (`SimCluster(seed, cfg)` is deterministic).
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Node logs, `raftstore status --all`, or the failing test output.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Ubuntu 24.04, Python 3.12, commit abc1234, 3 nodes"
    validations:
      required: true
