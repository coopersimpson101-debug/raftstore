name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might it work? Note any impact on the Raft protocol, the on-disk format or the fault model.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
